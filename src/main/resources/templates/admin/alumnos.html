<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Roller Speed</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Roller Speed (Admin)</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/admin/alumnos">Gestión de Alumnos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Listado de Alumnos e Inscritos</h2>
            <a href="/registro" class="btn btn-success">+ Nuevo Registro</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Medio de Pago</th>
                            <th>Rol</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Recorremos la lista de alumnos guardados en MySQL -->
                        <tr th:each="alumno : ${alumnos}">
                            <td th:text="${alumno.id}">1</td>
                            <td th:text="${alumno.nombre}">Nombre</td>
                            <td th:text="${alumno.correo}">correo@ejemplo.com</td>
                            <td th:text="${alumno.telefono}">3000000000</td>
                            <td th:text="${alumno.medioPago}">PSE</td>
                            <td><span class="badge bg-primary" th:text="${alumno.rol}">Alumno</span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(alumnos)}">
                            <td colspan="6" class="text-center text-muted py-4">No hay alumnos registrados aún.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
