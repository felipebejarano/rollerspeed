<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inscripción en Línea - Roller Speed</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Formulario de Registro de Aspirante</h4>
                    </div>
                    <div class="card-body p-4">

                        <!-- Mensaje de confirmación tras un registro exitoso -->
                        <div th:if="${param.exito}" class="alert alert-success">
                            ¡Inscripción realizada con éxito! Tu cuenta ha sido generada automáticamente con el rol de Alumno.
                        </div>

                        <!-- Mensaje de error si el correo está duplicado -->
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <!-- Formulario mapeado al objeto Alumno utilizando th:object y th:field -->
                        <form th:action="@{/registro}" th:object="${alumno}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label">Nombre Completo:</label>
                                <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Carlos Pérez" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fecha de Nacimiento:</label>
                                    <input type="date" th:field="*{fechaNacimiento}" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Género:</label>
                                    <select th:field="*{genero}" class="form-select" required>
                                        <option value="">Seleccione...</option>
                                        <option value="Femenino">Femenino</option>
                                        <option value="Masculino">Masculino</option>
                                        <option value="Otro">Otro</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Correo Electrónico:</label>
                                    <input type="email" th:field="*{correo}" class="form-control" placeholder="correo@ejemplo.com" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Teléfono:</label>
                                    <input type="text" th:field="*{telefono}" class="form-control" placeholder="3001234567" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Medio de Pago:</label>
                                <select th:field="*{medioPago}" class="form-select" required>
                                    <option value="">Seleccione medio de pago...</option>
                                    <option value="PSE / Transferencia">PSE / Transferencia Bancaria</option>
                                    <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                                    <option value="Efectivo">Efectivo en Sede</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">Completar Registro</button>
                                <a href="/" class="btn btn-outline-secondary">Volver al Inicio</a>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
