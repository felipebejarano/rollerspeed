<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicios - Roller Speed</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Roller Speed</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/servicios">Servicios</a></li>
                    <li class="nav-item"><a class="btn btn-primary ms-2" href="/registro">Inscribirse</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Nuestros Programas y Servicios</h2>
        <p class="text-muted">Ofrecemos alternativas adaptadas a todas las edades y niveles.</p>

        <!-- Recorremos dinámicamente la lista enviada por el controlador con th:each -->
        <ul class="list-group mt-4">
            <li class="list-group-item list-group-item-action" th:each="servicio : ${servicios}" th:text="${servicio}"></li>
        </ul>
    </div>
</body>
</html>
